# 海云镜像 —— 每日自动爬取 + 合并 + 统计 + 生成 sitemap + 百度收录推送 + 自动提交
# 每日北京时间 02:00 触发（= UTC 18:00），支持手动触发 / workflow_dispatch。
# 提交仓库后触发 Cloudflare Pages 自动构建。

name: daily-crawl

on:
  schedule:
    # 北京时间 02:00 = UTC 前一天 18:00
    - cron: '0 18 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: crawl-run
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run crawler pipeline
        env:
          BAIDU_SITE: ${{ secrets.BAIDU_SITE }}
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
        run: |
          python -m crawler.main

      - name: Show summary
        run: |
          echo "== stats =="
          python - <<'EOF'
          import json
          d = json.load(open('data/iso_data.json', encoding='utf-8'))
          s = d['stats']
          print('total:', s['total'], 'today_new:', s['today_new'], 'today_update:', s['today_update'], 'last_sync:', s['last_sync'])
          EOF

      - name: Commit & push (if changed)
        run: |
          git config user.name "seacloud-mirror-bot"
          git config user.email "bot@seacloud-mirror.local"
          git add -A data/ frontend/public/sitemap.xml frontend/public/robots.txt
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 每日自动同步三站数据 ($(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M'))"
            git pull --rebase origin main || true
            git push origin main
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "已完成"
          else
            git commit -m "chore: 数据推送状态更新" || echo "无变更"
            git push origin main || true
          fi
